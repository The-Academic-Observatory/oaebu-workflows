name: Unit Tests
on: [push]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      max-parallel: 4
      matrix:
        python-version: ["3.13"]
        os: [ubuntu-latest]

    steps:
      - name: Checkout ${{ matrix.python-version }}
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          cd ..

          sudo apt-get update
          sudo apt-get install pigz -y

          uv venv --python ${{ matrix.python-version }} /tmp/venv
          source /tmp/venv/bin/activate

          # Clone protection required until fix - https://github.com/git-lfs/git-lfs/issues/5749
          export GIT_CLONE_PROTECTION_ACTIVE=false 
          git clone -b airflow_3 https://github.com/The-Academic-Observatory/observatory-platform.git 
          # TODO: Remove branch when airflow_3 is merged
          uv pip install -e observatory-platform[tests] --constraint https://raw.githubusercontent.com/apache/airflow/constraints-3.2.2/constraints-no-providers-${{ matrix.python-version }}.txt

          cd oaebu-workflows
          uv pip install -r requirements.txt --constraint https://raw.githubusercontent.com/apache/airflow/constraints-3.2.2/constraints-no-providers-${{ matrix.python-version }}.txt

          uv pip freeze --system # for debugging

      - name: Add dag folder to PYTHONPATH
        run: |
          echo "PYTHONPATH=$HOME/work/oaebu-workflows/oaebu-workflows/dags:$HOME/work/oaebu-workflows/oaebu-workflows/plugins" >> "$GITHUB_ENV"

      # Required for testing ONIX Telescope
      - name: Set up JDK 11
        uses: actions/setup-java@v2
        with:
          java-version: "11"
          distribution: "adopt"

      - name: Check licenses
        run: |
          # stop the build if there are licensing issues
          uv venv /tmp/licensecheck-env --python ${{ matrix.python-version }}
          uv pip install --python /tmp/licensecheck-env/bin/python "pip<24.1" licensecheck
          /tmp/licensecheck-env/bin/licensecheck

      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run unit tests with coverage
        env:
          TEST_GCP_DATA_LOCATION: ${{ secrets.TEST_GCP_DATA_LOCATION }}
          TEST_GCP_PROJECT_ID: ${{ secrets.TEST_GCP_PROJECT_ID }}
          TEST_GCP_SERVICE_KEY: ${{ secrets.TEST_GCP_SERVICE_KEY }}
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/google_application_credentials.json
          AIRFLOW__CORE__LOAD_EXAMPLES: false
        run: |
          source /tmp/venv/bin/activate
          echo "${TEST_GCP_SERVICE_KEY}" | base64 --decode > /tmp/google_application_credentials.json
          coverage run -m unittest discover -v
          coverage xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4.0.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml
          fail_ci_if_error: false
