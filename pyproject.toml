[build-system]
requires = ["setuptools>=80.9.0", "setuptools-scm>=8.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oaebu-workflows"
version = "0.1.0"
description = "OAEBU Airflow workflows/telescopes"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "Curtin University", email = "agent@observatory.academy" }]

dependencies = [
    "beautifulsoup4>=4.9.3,<5",
    "onixcheck>=0.9.7,<1",
    "ratelimit>=2.2.1,<3",
    "oauth2client==4.1.3",
    "chardet>=5.0.0",
    "limits>=5.0.0,<6",
]

[project.optional-dependencies]
tests = [
    "flake8>=6.0.0,<7",
    "coverage>=5.2,<6",
    "faker>=8.12.1,<9",
    "vcrpy==8.3.0",
    "responses>=0,<1",
]

[tool.setuptools.packages.find]
where = ["dags"]
include = ["oaebu_workflows*"]

[tool.licensecheck]
only_licenses = [
    # Unencumbered licenses: https://opensource.google/docs/thirdparty/licenses/#unencumbered
    "public domain <http://unlicense.org>",
    "cc0 1.0 universal (cc0 1.0) public domain dedication",
    # Notice licenses: https://opensource.google/docs/thirdparty/licenses/#notice
    "artistic",
    "apache software license 2.0",
    "apache license version 2.0",
    "apache license, version 2.0",
    "apache license 2.0",
    "apache 2.0",
    "apache-2.0",
    "apache software",
    "apache 2",
    "apache-2",
    "bsd",
    "bsd-2-clause",
    "bsd-3-clause",
    "3-clause bsd",
    "new bsd",
    "bsd or apache license, version 2.0",
    "bsd-2-clause or apache-2.0",
    "isc license (iscl)",
    "isc",
    "mit",
    "python software foundation",
    "psf-2.0",
    "psfl",
    "zpl 2.1",
    # Reciprocal licenses: https://opensource.google/docs/thirdparty/licenses/#reciprocal
    "mozilla public license 1.1 (mpl 1.1)",
    "mozilla public license 2.0 (mpl 2.0)",
    "mpl-2.0",
    # LGPL
    "lgpl",
    "gnu library or lesser general public license (lgpl)",
    "gnu lesser general public license v3 or later (lgplv3+)",
    "lgplv3+",
    "the unlicense (unlicense)",
    "apache-2.0 and mit",
    "mit and psf-2.0",
]
fail_licenses = [
    # Banned licenses: https://opensource.google/docs/thirdparty/licenses/#banned
    "agpl",
    "affero gpl",
    "agpl (affero gpl)",
    "sspl"
]
zero = true
ignore_packages=[
    "text-unidecode", # perl artistic
    "certifi", # mozilla
    "isbnlib" # not ours
]
